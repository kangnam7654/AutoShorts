services:
  postgres:
    image: postgres:16-alpine
    container_name: mp-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moneyprinter}
      POSTGRES_USER: ${POSTGRES_USER:-moneyprinter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moneyprinter}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moneyprinter}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    container_name: mp-backend
    ports:
      - "8080:8080"
    command: ["python3", "Backend/main.py"]
    volumes:
      - ./temp:/app/temp
      - ./subtitles:/app/subtitles
      - ./Songs:/app/Songs
      - ./output:/app/output
      - ./Backend/client_secret.json:/app/Backend/client_secret.json:ro
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-moneyprinter}:${POSTGRES_PASSWORD:-moneyprinter}@postgres:5432/${POSTGRES_DB:-moneyprinter}
      IMAGEMAGICK_BINARY: /usr/bin/convert
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    container_name: mp-worker
    command: ["python3", "Backend/worker.py"]
    volumes:
      - ./temp:/app/temp
      - ./subtitles:/app/subtitles
      - ./Songs:/app/Songs
      - ./output:/app/output
      - ./Backend/client_secret.json:/app/Backend/client_secret.json:ro
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-moneyprinter}:${POSTGRES_PASSWORD:-moneyprinter}@postgres:5432/${POSTGRES_DB:-moneyprinter}
      IMAGEMAGICK_BINARY: /usr/bin/convert
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: .
    container_name: mp-frontend
    ports:
      - "3000:3000"
    command: ["python3", "-m", "http.server", "3000", "--directory", "Frontend"]
    restart: unless-stopped

volumes:
  postgres_data:
